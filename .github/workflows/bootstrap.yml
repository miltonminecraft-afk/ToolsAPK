name: Bootstrap ToolsAPK
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore complete repository
        run: bash .github/scripts/bootstrap.sh
