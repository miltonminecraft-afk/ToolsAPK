name: Bootstrap complete ToolsAPK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build complete source tree
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tools/kopermetingen tools/tv-codes tools/value-fiber-route tools/pop-checklist

          cat .source/koper/part-*.bin > /tmp/kopermetingen.gz
          gzip -t /tmp/kopermetingen.gz
          gzip -dc /tmp/kopermetingen.gz > tools/kopermetingen/index.html
          echo 'c0b827a3cf39287a072165606e7e7ad58b9b42ff9f0c49bc83ecb4a20ec16b64  tools/kopermetingen/index.html' | sha256sum -c -

          cat .source/tv/part-*.bin > /tmp/tv-codes.gz
          gzip -t /tmp/tv-codes.gz
          gzip -dc /tmp/tv-codes.gz > tools/tv-codes/index.html
          echo '181e9367aa4e71775bf601f5de6b40fb10d1ede2fcde8a0104eecbcaf2f34612  tools/tv-codes/index.html' | sha256sum -c -

          cat .source/fiber/part-*.bin > /tmp/value-fiber-route.gz
          gzip -t /tmp/value-fiber-route.gz
          gzip -dc /tmp/value-fiber-route.gz > tools/value-fiber-route/index.html
          echo 'bd3fd764eb532e883c8d26e54549260526f5aafbebb36c042fd40cda1839dcf5  tools/value-fiber-route/index.html' | sha256sum -c -

          node <<'NODE'
          const fs=require('fs'), z=require('zlib');
          const text=fs.readFileSync('.source/HioScanActivity.java.gz.b64','utf8').replace(/\s+/g,'');
          fs.writeFileSync('/tmp/HioScanActivity.java',z.gunzipSync(Buffer.from(text,'base64')));
          NODE
          echo 'dadfcee144e081ce712772151503e3bf1b60e2516a46d1fed1be0196cce5d005  /tmp/HioScanActivity.java' | sha256sum -c -

          POP_REF='d06eeeb2668c057fc7a9c4a3b132147178e20d28'
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/miltonminecraft-afk/pop-checklist/${POP_REF}/index.html" -o tools/pop-checklist/index.html
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/miltonminecraft-afk/pop-checklist/${POP_REF}/template.xlsx" -o tools/pop-checklist/template.xlsx
          echo '27fdee56db4fe739087adf1a13d6537437661e62dbba200e686492afb8210641  tools/pop-checklist/index.html' | sha256sum -c -
          echo '1b456732ea5a95e1dd17bb0695cf8a720022582d34cb70aaa7575629092635eb  tools/pop-checklist/template.xlsx' | sha256sum -c -

          # Bundle wllama locally: no CDN is needed to start the assistant.
          TMP_WLLAMA="$(mktemp -d)"
          PKG="$(cd "$TMP_WLLAMA" && npm pack @wllama/wllama@3.5.1 --silent)"
          tar -xzf "$TMP_WLLAMA/$PKG" -C "$TMP_WLLAMA"
          rm -rf tools/assistant/vendor
          mkdir -p tools/assistant/vendor/wllama
          cp -R "$TMP_WLLAMA/package/esm/." tools/assistant/vendor/wllama/
          test -f tools/assistant/vendor/wllama/index.js
          test -f tools/assistant/vendor/wllama/wasm/wllama.wasm

          cat > tools/assistant/runtimes/web-wllama.js <<'JS'
          import { Wllama, ModelManager, LoggerWithoutDebug } from '../vendor/wllama/index.js';

          const MODEL={
            repo:'ggml-org/Qwen3-1.7B-GGUF',
            file:'Qwen3-1.7B-Q4_K_M.gguf',
            name:'Qwen3-1.7B Q4_K_M'
          };
          const FLAG='toolsAssistantModelInstalledV2';
          const WASM={default:new URL('../vendor/wllama/wasm/wllama.wasm',import.meta.url).href};

          export class WebWllamaRuntime {
            constructor(){this.wllama=null;this.manager=null;this.loading=null}
            async _create(){
              if(this.wllama)return;
              this.manager=new ModelManager({allowOffline:true,parallelDownloads:3});
              this.wllama=new Wllama(WASM,{allowOffline:true,parallelDownloads:3,logger:LoggerWithoutDebug});
            }
            async info(){
              await this._create();
              return {type:'web',label:'Browser lokaal · llama.cpp/WASM',model:MODEL.name};
            }
            async isModelInstalled(){return localStorage.getItem(FLAG)==='1'}
            async _load(onProgress){
              await this._create();
              if(this.wllama.isModelLoaded())return;
              if(this.loading)return this.loading;
              this.loading=this.wllama.loadModelFromHF(
                {repo:MODEL.repo,file:MODEL.file},
                {useCache:true,n_ctx:4096,n_batch:256,progressCallback:onProgress?({loaded,total})=>onProgress(total?Math.round(loaded/total*100):0):undefined}
              ).finally(()=>{this.loading=null});
              return this.loading;
            }
            async installModel(onProgress){await this._load(onProgress);localStorage.setItem(FLAG,'1');return{ok:true}}
            async removeModel(){
              await this._create();
              try{if(this.wllama.isModelLoaded())await this.wllama.exit()}catch(e){}
              await this.manager.clear();
              localStorage.removeItem(FLAG);
              this.wllama=null;this.manager=null;
              return{ok:true};
            }
            async clearCache(){return{ok:true}}
            async generate(messages,options={}){
              try{await this._load()}
              catch(e){throw new Error('Lokaal AI-model kon niet worden geladen. Installeer het model opnieuw wanneer internet beschikbaar is.')}
              const response=await this.wllama.createChatCompletion({
                messages,max_tokens:options.maxTokens||500,temperature:options.temperature??0.35,top_k:40,top_p:0.92,reasoning:false
              });
              return response?.choices?.[0]?.message?.content||'';
            }
          }
          JS

          cat > tools/assistant/web-search.js <<'JS'
          const CALLBACK='__toolsWebSearchCallback';
          const pending=new Map();
          if(!window[CALLBACK]){
            window[CALLBACK]=(id,payload)=>{
              const p=pending.get(id);if(!p)return;pending.delete(id);
              try{const data=JSON.parse(payload);data.ok?p.resolve(data):p.reject(new Error(data.error||'Webzoekfout'))}
              catch(e){p.reject(e)}
            };
          }
          const id=()=> 'w'+Date.now().toString(36)+Math.random().toString(36).slice(2);
          const kpnQuestion=q=>/\b(kpn|experia|box 12|superwifi|tv\+|kpn tv|glasvezel|koper|isra|hvd|kvd)\b/i.test(q);

          function nativeSearch(query){
            return new Promise((resolve,reject)=>{
              const requestId=id();pending.set(requestId,{resolve,reject});
              const timer=setTimeout(()=>{pending.delete(requestId);reject(new Error('Webzoekopdracht timeout'))},12000);
              const oldResolve=resolve,oldReject=reject;
              pending.set(requestId,{resolve:v=>{clearTimeout(timer);oldResolve(v)},reject:e=>{clearTimeout(timer);oldReject(e)}});
              try{window.ToolsWebSearch.search(query,requestId)}catch(e){clearTimeout(timer);pending.delete(requestId);reject(e)}
            });
          }

          async function jinaSearch(query){
            const controller=new AbortController();
            const timer=setTimeout(()=>controller.abort(),10000);
            try{
              const r=await fetch('https://s.jina.ai/'+encodeURIComponent(query),{
                headers:{Accept:'text/plain'},signal:controller.signal
              });
              if(!r.ok)throw new Error('HTTP '+r.status);
              const text=(await r.text()).slice(0,14000);
              const sources=[...text.matchAll(/https?:\/\/[^\s)\]]+/g)].map(m=>m[0]).slice(0,8);
              return {ok:true,context:text,sources};
            }finally{clearTimeout(timer)}
          }

          export async function searchWeb(question){
            const q=String(question||'').trim();
            if(!q)return {ok:false,context:'',sources:[]};
            const queries=kpnQuestion(q)?['site:kpn.com '+q,'site:community.kpn.com '+q,q]:[q];
            const chunks=[];const sources=[];
            for(const query of queries){
              try{
                const r=window.ToolsWebSearch&&typeof window.ToolsWebSearch.search==='function'
                  ? await nativeSearch(query)
                  : await jinaSearch(query);
                if(r.context)chunks.push('ZOEKOPDRACHT: '+query+'\n'+r.context);
                if(Array.isArray(r.sources))sources.push(...r.sources);
              }catch(e){}
            }
            return {ok:chunks.length>0,context:chunks.join('\n\n').slice(0,24000),sources:[...new Set(sources)].slice(0,12)};
          }
          JS

          cat > tools/assistant/app.js <<'JS'
          import { createRuntime } from './runtime.js';
          import { TOOL_REGISTRY, toolContext } from './tool-registry.js';
          import { searchWeb } from './web-search.js';

          const qs=new URLSearchParams(location.search),embedded=qs.get('embedded')==='1',currentTool=qs.get('tool')||'';
          if(embedded)document.body.classList.add('embedded');
          const $=id=>document.getElementById(id),chat=$('chat'),input=$('input');
          const HISTORY_KEY='toolsAssistantHistoryV2',CONTEXT_KEY='toolsAssistantContextV2';
          const runtime=createRuntime();let history=[],busy=false,lastWeb=null;

          function save(){localStorage.setItem(HISTORY_KEY,JSON.stringify(history.slice(-24)))}
          function load(){try{history=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');if(!Array.isArray(history))history=[]}catch(e){history=[]}}
          function addBubble(role,text,store=true){
            const d=document.createElement('div');d.className='msg '+role;
            const markers=[];const clean=String(text||'').replace(/\[OPEN_TOOL:([a-z0-9-]+)\]/g,(_,k)=>{markers.push(k);return''}).replace(/\[OPEN_FULL_ASSISTANT\]/g,()=>{markers.push('__full__');return''}).trim();
            d.textContent=clean;chat.appendChild(d);
            markers.forEach(k=>{const b=document.createElement('button');b.className='btn secondary tool-link';if(k==='__full__'){b.textContent='Open volledige Assistent';b.onclick=openFull}else if(TOOL_REGISTRY[k]){b.textContent='Open '+TOOL_REGISTRY[k].name;b.onclick=()=>location.href=TOOL_REGISTRY[k].path}chat.appendChild(b)});
            if(store){history.push({role,content:text});save()}chat.scrollTop=chat.scrollHeight;
          }
          function render(){chat.innerHTML='';history.forEach(m=>addBubble(m.role,m.content,false));chat.scrollTop=chat.scrollHeight}
          function systemPrompt(web){
            const scope=currentTool?toolContext(currentTool):'Volledige Tools Assistent.';
            const toolList=Object.entries(TOOL_REGISTRY).map(([k,t])=>`${k}: ${t.name} - ${t.description}`).join('\n');
            let p=`Je bent Assistent, een korte praktische Nederlandstalige technische assistent voor de Tools-app. De AI draait lokaal. Geef concrete antwoorden. ${scope}\nBeschikbare tools:\n${toolList}\nWanneer een bestaande tool nodig is, voeg exact [OPEN_TOOL:sleutel] toe. Gebruik geen interne redeneerstappen.`;
            if(web?.context)p+='\n\nACTUELE WEBBRONNEN:\n'+web.context+'\n\nGebruik deze bronnen voor actuele feiten. Noem relevante bronlinks uit de broncontext en verzin geen bron.';
            return p;
          }
          async function refreshStatus(){
            try{const info=await runtime.info();$('runtimeLabel').textContent=info.label;$('modelLabel').textContent=info.model;const installed=await runtime.isModelInstalled();$('installButton').textContent=installed?'Model lokaal geïnstalleerd':'Model installeren'}
            catch(e){$('runtimeLabel').textContent='AI-runtime niet beschikbaar';$('modelLabel').textContent=e.message||String(e)}
          }
          async function install(){
            $('progress').style.display='block';$('progressBar').style.width='0%';$('installButton').disabled=true;
            try{await runtime.installModel(p=>{$('progressBar').style.width=Math.max(0,Math.min(100,p))+'%'});$('progressBar').style.width='100%';await refreshStatus()}
            catch(e){alert(e.message||e)}finally{$('installButton').disabled=false;setTimeout(()=>{$('progress').style.display='none'},900)}
          }
          async function getWeb(q,show=false){
            try{
              const r=await searchWeb(q);lastWeb=r;
              if(show)addBubble('assistant',r.ok?'Webbronnen gevonden: '+r.sources.slice(0,5).join('\n'):'Geen webbronnen beschikbaar; lokale Assistent blijft werken.');
              return r;
            }catch(e){if(show)addBubble('assistant','Webzoeken niet beschikbaar; lokale Assistent blijft werken.');return null}
          }
          async function send(){
            if(busy)return;const text=input.value.trim();if(!text)return;
            if(!(await runtime.isModelInstalled())){alert('Installeer eerst het lokale AI-model.');return}
            input.value='';addBubble('user',text);busy=true;$('sendButton').disabled=true;
            const wait=document.createElement('div');wait.className='msg assistant';wait.textContent=navigator.onLine?'Web controleren…':'Lokaal nadenken…';chat.appendChild(wait);
            try{
              const web=navigator.onLine||window.ToolsWebSearch?await getWeb(text,false):null;
              wait.textContent='…';
              const msgs=[{role:'system',content:systemPrompt(web)},...history.slice(-16).map(m=>({role:m.role,content:m.content}))];
              const answer=await runtime.generate(msgs,{maxTokens:500,temperature:.35});wait.remove();addBubble('assistant',answer||'Geen antwoord ontvangen.');
            }catch(e){wait.remove();addBubble('assistant','AI-fout: '+(e.message||e))}finally{busy=false;$('sendButton').disabled=false}
          }
          function info(){
            const t=TOOL_REGISTRY[currentTool];
            addBubble('assistant',t?`${t.name}\n${t.description}\n\nSnelle functies: ${t.actions.join(' · ')}`:'Ik kan uitleg geven over Kopermetingen, Afstandsbediening codes, Value Fiber Route en Checklist PoP.');
          }
          function openFull(){localStorage.setItem(CONTEXT_KEY,JSON.stringify({tool:currentTool,history:history.slice(-8)}));window.top.location.href='../assistant/index.html'}
          function currentQuery(){return input.value.trim()||history.filter(x=>x.role==='user').slice(-1)[0]?.content||''}
          function quick(){const box=$('quickActions');box.innerHTML='';const list=currentTool&&TOOL_REGISTRY[currentTool]?[currentTool]:Object.keys(TOOL_REGISTRY);for(const key of list){const t=TOOL_REGISTRY[key],b=document.createElement('button');b.className='btn secondary';b.textContent=t.name;b.onclick=()=>{if(currentTool===key)info();else location.href=t.path};box.appendChild(b)}}
          function theme(){document.body.classList.toggle('dark',(localStorage.getItem('toolsTheme')||'dark')==='dark')}

          $('sendButton').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
          $('installButton').onclick=install;$('infoButton').onclick=info;
          $('webButton').onclick=async()=>{const q=currentQuery();if(!q){alert('Typ eerst wat je wilt zoeken.');return}await getWeb(q,true)};
          $('cacheButton').onclick=async()=>{history=[];save();localStorage.removeItem(CONTEXT_KEY);await runtime.clearCache();render();addBubble('assistant','Chatgegevens gewist. Het lokale AI-model is behouden.')};
          $('removeModelButton').onclick=async()=>{if(!confirm('AI-model verwijderen?'))return;try{await runtime.removeModel();await refreshStatus()}catch(e){alert(e.message||e)}};
          $('backButton').onclick=()=>location.href='../../index.html';$('fullButton').onclick=openFull;if(embedded)$('fullButton').style.display='inline-block';
          window.addEventListener('storage',theme);theme();load();render();quick();refreshStatus();
          if('serviceWorker'in navigator&&!location.protocol.startsWith('file'))navigator.serviceWorker.register('../../sw.js').catch(()=>{});
          if(!history.length)addBubble('assistant',currentTool?`Je gebruikt de kleine Assistent voor ${TOOL_REGISTRY[currentTool]?.name||'deze tool'}.`:'Waar kan ik je mee helpen?');
          JS

          # Add the small Assistant loader to every tool without changing its existing functions.
          for f in tools/kopermetingen/index.html tools/tv-codes/index.html tools/value-fiber-route/index.html tools/pop-checklist/index.html; do
            grep -q '../../shared/assistant-mini.js' "$f" || sed -i 's#</body>#<script src="../../shared/assistant-mini.js"></script></body>#' "$f"
          done

          # Build the web source used by Capacitor.
          rm -rf www
          mkdir -p www
          cp index.html www/index.html
          cp -R tools www/tools
          cp -R shared www/shared

          # Service worker: app shell/runtime stays available offline after first load.
          python3 <<'PY'
          from pathlib import Path
          files=[]
          for p in Path('www').rglob('*'):
              if p.is_file() and p.stat().st_size < 12_000_000:
                  files.append('./'+p.relative_to('www').as_posix())
          body="const CACHE='toolsapk-v3';\nconst ASSETS="+repr(files).replace("'",'"')+";\nself.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting())));\nself.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));\nself.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(x=>{const y=x.clone();caches.open(CACHE).then(c=>c.put(e.request,y));return x}).catch(()=>r))) });\n"
          Path('www/sw.js').write_text(body)
          Path('sw.js').write_text(body)
          PY
          cp sw.js www/sw.js

          cat > package.json <<'JSON'
          {
            "name":"toolsapk",
            "version":"1.0.0",
            "private":true,
            "scripts":{"sync":"npx cap sync android","android":"npx cap open android"},
            "dependencies":{
              "@capacitor/android":"^8.4.0",
              "@capacitor/cli":"^8.4.0",
              "@capacitor/core":"^8.4.0",
              "@capacitor/filesystem":"^8.1.2",
              "@capacitor/share":"^8.0.1"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {"appId":"nl.tools.app","appName":"Tools","webDir":"www"}
          JSON

          npm install --no-audit --no-fund

          rm -rf android
          npx cap add android
          npx cap sync android

          mkdir -p android/app/src/main/java/nl/tools/app android/app/src/main/cpp
          cp /tmp/HioScanActivity.java android/app/src/main/java/nl/tools/app/HioScanActivity.java

          cat > android/app/src/main/java/nl/tools/app/NativeLlama.java <<'JAVA'
          package nl.tools.app;
          public final class NativeLlama {
              private static final boolean AVAILABLE;
              static { boolean ok; try { System.loadLibrary("tools_llama"); ok=true; } catch(Throwable ignored){ ok=false; } AVAILABLE=ok; }
              private NativeLlama(){}
              public static boolean isAvailable(){return AVAILABLE;}
              public static native String generate(String modelPath,String[] roles,String[] contents,int maxTokens,float temperature);
              public static native void unloadModel();
          }
          JAVA

          cat > android/app/src/main/java/nl/tools/app/LlamaBridge.java <<'JAVA'
          package nl.tools.app;
          import android.app.Activity;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.*;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.security.MessageDigest;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          public final class LlamaBridge {
              private final WebView webView; private final ExecutorService executor=Executors.newSingleThreadExecutor();
              private final File modelDir,modelFile;
              public LlamaBridge(Activity activity,WebView webView){this.webView=webView;modelDir=new File(activity.getFilesDir(),"ai/models");modelFile=new File(modelDir,"assistant-qwen3-1.7b-q4_k_m.gguf");}
              @JavascriptInterface public String getRuntimeInfo(){try{return new JSONObject().put("engine","llama.cpp").put("nativeAvailable",NativeLlama.isAvailable()).put("modelPath",modelFile.getAbsolutePath()).put("installed",modelFile.isFile()).toString();}catch(Exception e){return "{}";}}
              @JavascriptInterface public boolean isModelInstalled(){return NativeLlama.isAvailable()&&modelFile.isFile()&&modelFile.length()>100_000_000L;}
              @JavascriptInterface public void downloadModel(String url,String expectedSha256,String requestId){executor.execute(()->{File tmp=new File(modelDir,modelFile.getName()+".part");try{if(!modelDir.exists()&&!modelDir.mkdirs())throw new IOException("Modelmap kon niet worden gemaakt");HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();c.setInstanceFollowRedirects(true);c.setConnectTimeout(20000);c.setReadTimeout(60000);c.setRequestProperty("User-Agent","ToolsAPK/1.0");c.connect();if(c.getResponseCode()<200||c.getResponseCode()>=300)throw new IOException("Download HTTP "+c.getResponseCode());long total=c.getContentLengthLong(),done=0;MessageDigest digest=MessageDigest.getInstance("SHA-256");byte[] buf=new byte[1024*1024];try(InputStream in=new BufferedInputStream(c.getInputStream());OutputStream out=new BufferedOutputStream(new FileOutputStream(tmp))){int n,last=-1;while((n=in.read(buf))>0){out.write(buf,0,n);digest.update(buf,0,n);done+=n;if(total>0){int p=(int)(done*100/total);if(p!=last){last=p;progress(requestId,p);}}}}String sha=hex(digest.digest());if(expectedSha256!=null&&!expectedSha256.isEmpty()&&!sha.equalsIgnoreCase(expectedSha256))throw new IOException("SHA-256 controle mislukt");if(modelFile.exists()&&!modelFile.delete())throw new IOException("Oud model kon niet worden vervangen");if(!tmp.renameTo(modelFile))throw new IOException("Model kon niet worden geplaatst");callback(requestId,new JSONObject().put("ok",true).put("bytes",modelFile.length()).toString());}catch(Exception e){tmp.delete();callback(requestId,error(e));}});}
              @JavascriptInterface public void generate(String requestJson,String requestId){executor.execute(()->{try{if(!NativeLlama.isAvailable())throw new IllegalStateException("Native llama.cpp is niet beschikbaar");if(!isModelInstalled())throw new IllegalStateException("AI-model is niet geïnstalleerd");JSONObject req=new JSONObject(requestJson);JSONArray a=req.getJSONArray("messages");String[] roles=new String[a.length()],contents=new String[a.length()];for(int i=0;i<a.length();i++){JSONObject m=a.getJSONObject(i);roles[i]=m.optString("role","user");contents[i]=m.optString("content","");}String text=NativeLlama.generate(modelFile.getAbsolutePath(),roles,contents,req.optInt("max_tokens",500),(float)req.optDouble("temperature",0.35));if(text!=null&&text.startsWith("__ERROR__:"))throw new RuntimeException(text.substring(10));callback(requestId,new JSONObject().put("ok",true).put("text",text==null?"":text).toString());}catch(Exception e){callback(requestId,error(e));}});}
              @JavascriptInterface public void removeModel(String requestId){executor.execute(()->{try{if(NativeLlama.isAvailable())NativeLlama.unloadModel();if(modelFile.exists()&&!modelFile.delete())throw new IOException("Model kon niet worden verwijderd");callback(requestId,"{\"ok\":true}");}catch(Exception e){callback(requestId,error(e));}});}
              @JavascriptInterface public void clearAssistantCache(String requestId){callback(requestId,"{\"ok\":true}");}
              private void progress(String id,int p){webView.post(()->webView.evaluateJavascript("window.__toolsNativeLlamaProgress&&window.__toolsNativeLlamaProgress("+JSONObject.quote(id)+","+p+");",null));}
              private void callback(String id,String payload){webView.post(()->webView.evaluateJavascript("window.__toolsNativeLlamaCallback&&window.__toolsNativeLlamaCallback("+JSONObject.quote(id)+","+JSONObject.quote(payload)+");",null));}
              private static String error(Exception e){try{return new JSONObject().put("ok",false).put("error",e.getMessage()==null?e.getClass().getSimpleName():e.getMessage()).toString();}catch(Exception ignored){return "{\"ok\":false,\"error\":\"Onbekende fout\"}";}}
              private static String hex(byte[] bytes){StringBuilder s=new StringBuilder();for(byte b:bytes)s.append(String.format(Locale.US,"%02x",b));return s.toString();}
          }
          JAVA

          cat > android/app/src/main/java/nl/tools/app/WebSearchBridge.java <<'JAVA'
          package nl.tools.app;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.*;
          import java.net.*;
          import java.nio.charset.StandardCharsets;
          import java.util.*;
          import java.util.concurrent.*;
          import java.util.regex.*;
          public final class WebSearchBridge {
              private final WebView webView; private final ExecutorService executor=Executors.newFixedThreadPool(2);
              public WebSearchBridge(WebView webView){this.webView=webView;}
              @JavascriptInterface public void search(String query,String requestId){executor.execute(()->{try{JSONObject out=runSearch(query);out.put("ok",true);callback(requestId,out.toString());}catch(Exception e){try{callback(requestId,new JSONObject().put("ok",false).put("error",String.valueOf(e.getMessage())).toString());}catch(Exception ignored){}}});}
              private JSONObject runSearch(String query)throws Exception{
                  String html=get("https://html.duckduckgo.com/html/?q="+URLEncoder.encode(query,"UTF-8"),12000,900000);
                  Pattern p=Pattern.compile("class=\\\"result__a\\\"[^>]*href=\\\"([^\\\"]+)\\\"",Pattern.CASE_INSENSITIVE);
                  Matcher m=p.matcher(html);LinkedHashSet<String> urls=new LinkedHashSet<>();
                  while(m.find()&&urls.size()<5){String u=decodeUrl(m.group(1));if(u.startsWith("http://")||u.startsWith("https://"))urls.add(u);}
                  JSONArray src=new JSONArray();StringBuilder ctx=new StringBuilder();
                  for(String u:urls){try{String page=get(u,10000,700000);String text=clean(page);if(text.length()>4000)text=text.substring(0,4000);src.put(u);ctx.append("BRON: ").append(u).append("\n").append(text).append("\n\n");}catch(Exception ignored){}}
                  return new JSONObject().put("context",ctx.toString()).put("sources",src);
              }
              private static String decodeUrl(String raw)throws Exception{
                  String s=raw.replace("&amp;","&");
                  if(s.startsWith("//"))s="https:"+s;
                  try{URL u=new URL(s);String q=u.getQuery();if(q!=null)for(String part:q.split("&"))if(part.startsWith("uddg="))return URLDecoder.decode(part.substring(5),"UTF-8");}catch(Exception ignored){}
                  return s;
              }
              private static String get(String url,int timeout,int max)throws Exception{
                  HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();c.setConnectTimeout(timeout);c.setReadTimeout(timeout);c.setInstanceFollowRedirects(true);c.setRequestProperty("User-Agent","Mozilla/5.0 ToolsAPK/1.0");c.setRequestProperty("Accept-Language","nl,en;q=0.8");
                  InputStream in=c.getResponseCode()>=400?c.getErrorStream():c.getInputStream();if(in==null)throw new IOException("HTTP "+c.getResponseCode());
                  ByteArrayOutputStream out=new ByteArrayOutputStream();byte[] b=new byte[8192];int n,total=0;while((n=in.read(b))>0&&total<max){out.write(b,0,n);total+=n;}in.close();return out.toString(StandardCharsets.UTF_8.name());
              }
              private static String clean(String html){return html.replaceAll("(?is)<script.*?</script>"," ").replaceAll("(?is)<style.*?</style>"," ").replaceAll("(?is)<[^>]+>"," ").replace("&nbsp;"," ").replace("&amp;","&").replace("&quot;","\"").replaceAll("\\s+"," ").trim();}
              private void callback(String id,String payload){webView.post(()->webView.evaluateJavascript("window.__toolsWebSearchCallback&&window.__toolsWebSearchCallback("+JSONObject.quote(id)+","+JSONObject.quote(payload)+");",null));}
          }
