s,llama_sampler_init_temp(std::max(0.05f,(float)jt)));llama_sampler_chain_add(s,llama_sampler_init_dist(LLAMA_DEFAULT_SEED));llama_batch b=llama_batch_get_one(tok.data(),tok.size());if(llama_decode(ctx,b)!=0){llama_sampler_free(s);llama_free(ctx);return e->NewStringUTF("__ERROR__:prompt decode mislukt");}std::string out;int max=std::max(1,std::min(1024,(int)jm));for(int i=0;i<max;i++){llama_token t=llama_sampler_sample(s,ctx,-1);if(llama_vocab_is_eog(v,t))break;char buf[512];int k=llama_token_to_piece(v,t,buf,sizeof(buf),0,true);if(k>0)out.append(buf,k);b=llama_batch_get_one(&t,1);if(llama_decode(ctx,b)!=0)break;}llama_sampler_free(s);llama_free(ctx);return e->NewStringUTF(out.c_str());}
