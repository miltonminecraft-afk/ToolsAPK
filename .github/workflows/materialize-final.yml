name: Materialiseer definitieve repo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ hashFiles('scripts/materialize-final.mjs') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/materialize-final.mjs
      - name: Commit schone projectboom
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Materialiseer definitieve ToolsAPK"
          git push
