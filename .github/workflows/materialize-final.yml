name: Materialiseer definitieve repo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bouw definitieve projectboom
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/materialize-final.mjs')
          s=p.read_text()
          old="""const koperBase=await materializeKoper();
          await write('tools/kopermetingen/index.html',koperBase);
          execFileSync('git',['apply','--check','patches/kopermetingen-latest.patch'],{cwd:root,stdio:'inherit'});
          execFileSync('git',['apply','patches/kopermetingen-latest.patch'],{cwd:root,stdio:'inherit'});
          let koper=await readFile(A('tools/kopermetingen/index.html'));if(sha256(koper)!==expected.koperFinal)throw new Error('Kopermetingen eindhash klopt niet');"""
          new="""const koper=gunzipSync(Buffer.from((await readFile(A('src-current/kopermetingen-current.gz.b64'),'utf8')).replace(/\\s+/g,''),'base64'));
          if(sha256(koper)!==expected.koperFinal)throw new Error('Actuele Kopermetingen bronhash klopt niet');"""
          if old not in s:
              raise SystemExit('Koper finalizerblok niet gevonden')
          s=s.replace(old,new,1)
          s=s.replace("'src-direct','src-final'","'src-direct','src-current','src-final'",1)
          p.write_text(s)
          PY
          node scripts/materialize-final.mjs
      - name: Commit schone projectboom
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Materialiseer definitieve ToolsAPK"
          git push
