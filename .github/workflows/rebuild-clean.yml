name: Rebuild clean ToolsAPK
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Zet exacte bestaande bestanden op hun definitieve paden
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/kopermetingen tools/tv-codes tools/value-fiber-route tools/pop-checklist
          mkdir -p android/app/src/main/java/nl/tools/app

          cat .source/koper/part-*.bin > /tmp/kopermetingen.gz
          gzip -t /tmp/kopermetingen.gz
          gzip -dc /tmp/kopermetingen.gz > tools/kopermetingen/index.html
          echo 'c0b827a3cf39287a072165606e7e7ad58b9b42ff9f0c49bc83ecb4a20ec16b64  tools/kopermetingen/index.html' | sha256sum -c -

          base64 -d .source/tv-codes.gz.b64 | gzip -dc > tools/tv-codes/index.html
          echo '181e9367aa4e71775bf601f5de6b40fb10d1ede2fcde8a0104eecbcaf2f34612  tools/tv-codes/index.html' | sha256sum -c -

          base64 -d .source/value-fiber-route.gz.b64 | gzip -dc > tools/value-fiber-route/index.html
          echo 'bd3fd764eb532e883c8d26e54549260526f5aafbebb36c042fd40cda1839dcf5  tools/value-fiber-route/index.html' | sha256sum -c -
          grep -Fq 'firstTestableIndex' tools/value-fiber-route/index.html
          grep -Fq 'firstStartCheckIndex' tools/value-fiber-route/index.html
          grep -Fq 'Testen' tools/value-fiber-route/index.html

          base64 -d .source/HioScanActivity.java.gz.b64 | gzip -dc > android/app/src/main/java/nl/tools/app/HioScanActivity.java
          echo 'dadfcee144e081ce712772151503e3bf1b60e2516a46d1fed1be0196cce5d005  android/app/src/main/java/nl/tools/app/HioScanActivity.java' | sha256sum -c -
          grep -Fq 'int threshold = hasVPair(item) ? 2 : 3;' android/app/src/main/java/nl/tools/app/HioScanActivity.java
          grep -Fq 'return hits >= threshold;' android/app/src/main/java/nl/tools/app/HioScanActivity.java
          grep -Fq 'combinedServiceAndPhone' android/app/src/main/java/nl/tools/app/HioScanActivity.java

          POP_REF='d06eeeb2668c057fc7a9c4a3b132147178e20d28'
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/miltonminecraft-afk/pop-checklist/${POP_REF}/index.html" -o tools/pop-checklist/index.html
          echo '27fdee56db4fe739087adf1a13d6537437661e62dbba200e686492afb8210641  tools/pop-checklist/index.html' | sha256sum -c -
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/miltonminecraft-afk/pop-checklist/${POP_REF}/template.xlsx" -o tools/pop-checklist/template.xlsx
          echo '1b456732ea5a95e1dd17bb0695cf8a720022582d34cb70aaa7575629092635eb  tools/pop-checklist/template.xlsx' | sha256sum -c -

          test -f index.html
          test -f tools/assistant/index.html
          test -f tools/assistant/runtimes/web-wllama.js
          test -f tools/assistant/runtimes/android-native.js
          test -f android/app/src/main/java/nl/tools/app/MainActivity.java
          test -f android/app/src/main/java/nl/tools/app/LlamaBridge.java
          test -f android/app/src/main/cpp/llama_jni.cpp

          cat > .github/workflows/pages.yml <<'YAML'
          name: Deploy GitHub Pages
          on:
            push:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
            pages: write
            id-token: write
          concurrency:
            group: pages
            cancel-in-progress: true
          jobs:
            deploy:
              environment:
                name: github-pages
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Controleer statische site
                  shell: bash
                  run: |
                    set -euo pipefail
                    test -f index.html
                    test -f tools/kopermetingen/index.html
                    test -f tools/tv-codes/index.html
                    test -f tools/value-fiber-route/index.html
                    test -f tools/pop-checklist/index.html
                    test -f tools/pop-checklist/template.xlsx
                    test -f tools/assistant/index.html
                    rm -rf _site
                    mkdir -p _site
                    cp index.html _site/index.html
                    cp -R tools _site/tools
                    cp -R shared _site/shared
                    touch _site/.nojekyll
                - uses: actions/configure-pages@v5
                - uses: actions/upload-pages-artifact@v3
                  with:
                    path: _site
                - name: Deploy
                  id: deployment
                  uses: actions/deploy-pages@v4
          YAML

          touch .nojekyll
          rm -rf .source
          rm -f .github/workflows/rebuild-clean.yml

      - name: Commit schone repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild ToolsAPK clean from exact existing files'
          git push origin HEAD:main
