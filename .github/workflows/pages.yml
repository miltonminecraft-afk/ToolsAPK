name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controleer en bouw statische site
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f tools/kopermetingen/index.html
          test -f tools/tv-codes/index.html
          test -f tools/value-fiber-route/index.html
          test -f tools/pop-checklist/index.html
          test -f tools/pop-checklist/template.xlsx
          test -f tools/assistant/index.html
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R tools _site/tools
          cp -R shared _site/shared
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
