name: Materialiseer actuele Tools

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src-packed2/**'
      - 'src-packed-current/**'
      - 'scripts/materialize.mjs'
      - '.github/workflows/materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialiseer actuele GPT-bronnen
        run: node scripts/materialize.mjs

      - name: Commit echte projectbestanden
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools android
          if git diff --cached --quiet; then
            echo "Geen wijzigingen nodig."
          else
            git commit -m "Materialiseer actuele Tools bestanden [skip ci]"
            git push
          fi
