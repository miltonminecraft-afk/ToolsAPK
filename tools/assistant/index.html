<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Assistent</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--panel2:#eef1f7;--text:#10141d;--muted:#667085;--border:#d6dbe6;--accent:#00C300;--input:#fff}
body.dark{--bg:#07090d;--panel:#11151d;--panel2:#0c0f15;--text:#f4f6fb;--muted:#a8afbd;--border:#2a303c;--accent:#e02020;--input:#090c12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}.app{min-height:100vh;padding:16px}.header{position:sticky;top:0;z-index:20;margin:-16px -16px 14px;padding:18px 16px;background:var(--accent);color:#fff;border-radius:0 0 18px 18px;display:flex;align-items:center;gap:12px}.header button{width:44px;height:44px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.16);color:#fff;border-radius:14px;font-size:24px}.header h1{margin:0;font-size:22px}.status,.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:12px}.status{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;background:var(--accent);color:#fff;padding:10px 12px;border-radius:10px;font-weight:800;cursor:pointer}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border)}.btn.danger{background:#9d2020}.progress{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:8px;display:none}.progress>div{height:100%;width:0;background:var(--accent)}.chat{display:flex;flex-direction:column;gap:10px;min-height:280px;max-height:56vh;overflow:auto;padding:4px}.msg{max-width:88%;padding:11px 12px;border-radius:13px;line-height:1.45;white-space:pre-wrap}.msg.user{align-self:flex-end;background:var(--accent);color:#fff}.msg.assistant{align-self:flex-start;background:var(--panel2);border:1px solid var(--border)}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.composer textarea{resize:none;min-height:48px;max-height:130px;background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px;font:inherit}.quick{display:flex;gap:7px;overflow:auto;padding:2px 0 8px}.quick button{white-space:nowrap}.tool-link{margin-top:8px}.embedded .header{display:none}.embedded .app{padding:10px}.embedded .status{margin-top:0}.embedded .chat{max-height:52vh}.embedded #mainOnly{display:none}@media(max-width:560px){.composer{grid-template-columns:1fr}.composer .btn{min-height:44px}}
</style>
</head>
<body class="dark"><div class="app">
<header class="header"><button id="backButton" type="button">‹</button><h1>Assistent</h1></header>
<section class="status"><div><strong id="runtimeLabel">AI-runtime laden…</strong><div class="muted" id="modelLabel"></div></div><div class="actions"><button class="btn" id="installButton" type="button">Model installeren</button><button class="btn secondary" id="cacheButton" type="button">Cache legen</button><button class="btn danger" id="removeModelButton" type="button">AI-model verwijderen</button></div><div class="progress" id="progress"><div id="progressBar"></div></div></section>
<section class="card"><div class="quick" id="quickActions"></div><div class="chat" id="chat"></div><div class="composer"><textarea id="input" placeholder="Stel je vraag…"></textarea><button class="btn" id="sendButton" type="button">Versturen</button></div><div class="actions" style="margin-top:8px"><button class="btn secondary" id="infoButton" type="button">Info over werking</button><button class="btn secondary" id="webButton" type="button">Zoek actuele KPN-info</button><button class="btn secondary" id="fullButton" type="button" style="display:none">Open volledige Assistent</button></div></section>
<div id="mainOnly" class="muted">De browserversie draait lokaal via llama.cpp/WASM (wllama). De Android-app gebruikt dezelfde chatinterface via de native llama.cpp-bridge.</div>
</div><script type="module" src="./app.js"></script></body></html>
